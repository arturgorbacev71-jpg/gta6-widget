<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 6 Live Widget</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 10px;
  background: transparent;
  color: white;
  font-family: Arial, sans-serif;
}

.panel {
  max-width: 750px;
  margin: auto;
  padding: 18px;
  background: rgba(8,12,18,.95);
  border: 2px solid #26e6cf;
  border-radius: 16px;
}

.header {
  color: #26e6cf;
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: bold;
}

.rank {
  color: #ffd166;
  font-size: 28px;
  font-weight: bold;
  margin: 8px 0;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 15px 0;
}

.stat {
  background: #17212c;
  padding: 13px;
  border-radius: 12px;
}

.label {
  color: #9aabba;
  font-size: 11px;
  text-transform: uppercase;
}

.value {
  font-size: 23px;
  font-weight: bold;
  margin-top: 5px;
}

.bar {
  height: 9px;
  background: #34414e;
  border-radius: 10px;
  margin-top: 8px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: #26e6cf;
}

.mission {
  display: flex;
  gap: 10px;
  align-items: center;
  background: #17212c;
  padding: 10px;
  border-radius: 8px;
  margin-top: 7px;
  font-size: 14px;
}

.check {
  color: #26e6cf;
  font-size: 19px;
}

.done {
  text-decoration: line-through;
  color: #84929e;
}

.footer {
  text-align: right;
  color: #26e6cf;
  font-size: 10px;
  margin-top: 12px;
}
</style>
</head>

<body>

<div class="panel">

  <div class="header">GTA VI • LIVE CHALLENGE</div>

  <div class="rank" id="rank">Загрузка...</div>

  <div class="stats">

    <div class="stat">
      <div class="label">Баланс</div>
      <div class="value" id="money">0 BYN</div>
    </div>

    <div class="stat">
      <div class="label">Цель стрима</div>
      <div class="value">1000 BYN</div>
      <div class="bar">
        <div class="fill" id="bar"></div>
      </div>
    </div>

  </div>

  <div class="label">Миссии текущего ранга</div>
  <div class="label" id="progress">0 / 10</div>

  <div id="missions"></div>

  <div class="footer" id="status">
    ПОДКЛЮЧЕНИЕ...
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

// FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "AIzaSyA7cibhFQfUqPwnuGRq0-XR7hyLmQ4p_7E",
  authDomain: "gta6wid.firebaseapp.com",
  databaseURL: "https://gta6wid-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gta6wid",
  storageBucket: "gta6wid.firebasestorage.app",
  messagingSenderId: "1099205168563",
  appId: "1:1099205168563:web:f8e10e8e6b140be175cfc6"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const names=["Нищий","Уличный делец","Предприниматель","Бизнес-магнат","Миллионер"];

const defaultState = {
  money: 0,
  rank: 0,
  ranks: defaultRanks.map(name => ({
    name,
    missions: Array.from({length: 10}, (_, i) => ({
      text: "Миссия " + (i + 1),
      done: false
    }))
  }))
};

// ОБНОВЛЕНИЕ ВИДЖЕТА

db.ref("gta6/state").on("value", snapshot => {

  const state = snapshot.val() || defaultState;

  const rankNumber = Math.max(
    0,
    Math.min(4, Number(state.rank) || 0)
  );

  const rank = state.ranks?.[rankNumber]
    || defaultState.ranks[rankNumber];

  const money = Math.max(0, Number(state.money) || 0);

  document.getElementById("rank").textContent =
    rank.name || defaultRanks[rankNumber];

  document.getElementById("money").textContent =
    money.toLocaleString("ru-RU") + " BYN";

  document.getElementById("bar").style.width =
    Math.min(100, money / 10) + "%";

  const missions = Array.isArray(rank.missions)
    ? rank.missions
    : defaultState.ranks[rankNumber].missions;

  const completed = missions.filter(
    mission => mission && mission.done
  ).length;

  document.getElementById("progress").textContent =
    completed + " / 10";

  const container = document.getElementById("missions");
  container.innerHTML = "";

  missions.slice(0, 10).forEach((mission, index) => {

    const row = document.createElement("div");
    row.className = "mission";

    const check = document.createElement("span");
    check.className = "check";
    check.textContent = mission.done ? "✓" : "○";

    const name = document.createElement("span");
    name.textContent =
      mission.text || ("Миссия " + (index + 1));

    if (mission.done) {
      name.className = "done";
    }

    row.appendChild(check);
    row.appendChild(name);

    container.appendChild(row);

  });

  document.getElementById("status").textContent =
    "● LIVE • СИНХРОНИЗАЦИЯ";

}, error => {

  document.getElementById("status").textContent =
    "ОШИБКА ПОДКЛЮЧЕНИЯ";

  console.error(error);

});

</script>

</body>
</html>
